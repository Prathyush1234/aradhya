<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My CSL</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif}
body{margin:0;background:#020d18;color:#fff;min-height:100vh;font-size:12px}
b,h1,h2,h3{font-weight:800}button,[onclick]{cursor:pointer}
.bg1,.bg2{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg1{background:radial-gradient(circle at 50% 25%,#062d4680,#020d18eb 70%),url('https://images.unsplash.com/photo-1544551763-46a013bb70d5?w=900') center 35%/cover}
.bg2{background:linear-gradient(#020d188c,#03131fbf,#010911f5)}
.gl,.cd{background:#061825e6;backdrop-filter:blur(14px);border:1px solid #0f354c;border-radius:18px;padding:15px;box-shadow:0 12px 28px #0008}
.gl{border-radius:26px;padding:18px}.sb{background:#04131e;border:1px solid #0e2c3e;border-radius:14px;padding:10px}
.cA,.c1{border-radius:16px;padding:13px;border:1px solid #0e2c3e;background:#071825cc}
.cA{border:2px solid #16b8d8;background:#092a3ae6;box-shadow:0 0 20px #16b8d859}
.iB,.rB,.bt,.fc{display:flex;align-items:center;justify-content:center;flex-shrink:0}
.iB{width:44px;height:44px;border-radius:12px}.rB{width:38px;height:38px;border-radius:99px}
.kB{width:24px;height:3px;background:#f59e0b;border-radius:9px}.kT{font-size:11px;font-weight:700;letter-spacing:.08em;color:#fbbf24}
.inp{width:100%;background:#04131e;border:1px solid #144254;border-radius:10px;padding:7px 10px;color:#fff;font-weight:700;margin-top:3px;outline:none}
.bt{padding:9px 13px;border-radius:12px;font-weight:800;gap:6px}.bC{background:#16b8d8;color:#031724;font-weight:800}
.bD{background:#072233;border:1px solid #22d3ee55;color:#67e8f9;border-radius:12px;padding:6px 12px;font-weight:700}
.fb,.fl{display:flex;align-items:center;gap:10px}.fb{justify-content:space-between}
.g2,.g3,.g4,.g7{display:grid;gap:7px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}.g7{grid-template-columns:repeat(7,1fr);gap:4px}
.t0{font-size:10px;text-transform:uppercase;color:#64748b;font-weight:700}.tx{font-size:10px}.sm{font-size:14px}.bs{font-size:16px}.lg{font-size:18px}
.m2{margin-bottom:8px}.m3{margin-bottom:12px}.m4{margin-bottom:16px}.rx{border-radius:12px}.rf{border-radius:99px}
.ts{color:#94a3b8}.tc{color:#22d3ee}.ta{color:#fbbf24}.te{color:#34d399}.fm{font-family:monospace}.tr{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mw{min-width:0}
</style>
</head>
<body class="flex flex-col min-h-screen">
<div class="bg1"></div><div class="bg2"></div>
<header class="sticky top-0 z-40 bg-[#041521]/95 border-b border-[#0e2c3e] px-4 py-2">
<div class="max-w-lg mx-auto fb">
<div class="fl"><button onclick="H('mMod').classList.toggle('hidden')" class="bD bs">☰</button><b onclick="go('front')" class="lg">My CSL</b></div>
<div class="fl"><button onclick="togL()" id="lBtn" class="bD rf">🌐 EN</button><div onclick="go('dashboard')" id="hdrLogo" class="p-0.5 rf ring-2 ring-cyan-400/70 bg-[#061522]"></div></div>
</div>
<div id="mMod" class="hidden max-w-lg mx-auto pt-2 g2"></div>
</header>
<main id="appView" class="relative z-10 flex-1 w-full max-w-lg mx-auto px-4 py-5 flex flex-col justify-between"></main>
<footer class="relative z-10 mt-auto py-3 bg-[#010911]/90 border-t border-[#0d2638] text-center tx ts">© 2026 Cochin Shipyard Limited • A Govt. of India Undertaking</footer>
<script>
const K='csl_pv3',MN=Array.from({length:12},(_,i)=>new Date(9,i).toLocaleString('en',{month:'long'}));
const SH={C1:['Day / Gen','08:00 AM','04:20 PM'],A2:['Morning','07:00 AM','03:30 PM'],B2:['Evening','03:00 PM','11:30 PM'],C2:['Night','10:45 PM','06:45 AM']};
const QC=[[1,'Q1',2,3,4],[2,'Q2',5,6,7],[3,'Q3',8,9,10],[4,'Q4',11,0,1]];
const LOGO=`<svg width="40" height="40" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#041522" stroke="#f59e0b" stroke-width="6"/><path d="M24 58L50 38L76 58L67 71L33 71Z" fill="#22d3ee"/><rect x="44" y="25" width="12" height="13" rx="2" fill="#f59e0b"/><text x="50" y="88" font-size="12" font-weight="900" fill="#fbbf24" text-anchor="middle">CSL</text></svg>`;
const ARR=`<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.6" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>`;
const fD=s=>s?s.split('-').reverse().join('/'):'',R=n=>'₹'+Number(n||0).toLocaleString('en-IN'),H=id=>document.getElementById(id),P=n=>String(n).padStart(2,'0');
const st=(l,v,c='tc')=>`<div class="sb text-center"><div class="t0">${l}</div><b class="sm ${c} block">${v}</b></div>`;
const ip=(id,ph,t='text',v='')=>`<input id="${id}" type="${t}" placeholder="${ph}" value="${v}" class="inp"/>`;
const sl=(id,o)=>`<select id="${id}" class="inp">${o.split(',').map(x=>`<option>${x}</option>`).join('')}</select>`;
const rw=(t,s,v,c,fn)=>`<div class="fb p-2 rx sb"><div><b>${t}</b> <span class="ts">${s}</span></div><span class="fl"><b class="${c}">${v}</b><button onclick="${fn};u()" class="text-rose-400">✕</button></span></div>`;
const sc=(t,c,r,f,fn,bt,bc)=>`<div class="sb m3"><b class="${c}">${t}</b><div class="space-y-1.5 my-2">${r}</div><div class="g2 m2">${f}</div><button onclick="${fn}" class="bt w-full ${bc}">➕ ${bt}</button></div>`;
const brand=bk=>`<div class="fb m4"><div class="fl"><div class="p-0.5 rf ring-2 ring-amber-500/70 bg-[#061522]">${LOGO}</div><div><h1 class="bs">Cochin Shipyard Limited</h1><p class="tx ts">A GOVERNMENT OF INDIA UNDERTAKING</p></div></div>${bk?`<button onclick="go('${bk}')" class="bD rf">← Back</button>`:''}</div>`;
const pg=(t,s,r,b)=>`<div>${brand('dashboard')}<div class="cd"><div class="fb m3"><div><h2 class="bs">${t}</h2><p class="tc">${s}</p></div>${r}</div>${b}</div></div>`;
const rc=(fn,c,ic,ib,t,s,sc,rb)=>`<div onclick="${fn}" class="${c} fb"><div class="fl mw"><div class="iB ${ib}"><b>${ic}</b></div><div class="mw"><div class="sm fl tr"><b>${t}</b></div><div class="${sc} tr">${s}</div></div></div><div class="rB ${rb}">${ARR}</div></div>`;
const nDT=()=>{const n=new Date(),h=n.getHours();return`${P(n.getDate())}/${P(n.getMonth()+1)}/${n.getFullYear()}, ${P(h%12||12)}:${P(n.getMinutes())} ${h>=12?'PM':'AM'}`};
let S={view:'front',lang:'en',cat:'permanent',more:false,name:'Prathyush Mohan K',tok:'00005312',ph:'7559972544',sh:'A2',qCap:120,qCyc:3,cM:10,att:{'2026-11-02':{s:'P',in:'07:00 AM',out:'05:30 PM',ot:2,nt:'Shift A2'}},sal:{b:46500,da:42.4,hr:20,pr:32,otR:410,pf:7830},tax:{inc:980000},bks:[{id:1,b:'SBI',ac:'4821',tp:'Savings',bl:84500},{id:2,b:'Federal Bank',ac:'9104',tp:'Salary',bl:42300}],cds:[{id:1,b:'SBI Card ELITE',us:24500,du:'15/11/2026'}],txs:[{id:1,t:'Fuel & Travel',m:'Bank Account',a:1200,dt:'02/11/2026, 08:30 AM'},{id:2,t:'CSL Canteen',m:'UPI / Bank',a:450,dt:'02/11/2026, 01:15 PM'}]};
try{const sv=localStorage.getItem(K);if(sv)S={...S,...JSON.parse(sv),view:'front'}}catch(e){}
const u=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){};render()},set=(k,v)=>{S[k]=v;u()};
function togL(){S.lang=S.lang==='en'?'ml':'en';H('lBtn').textContent=S.lang==='en'?'🌐 EN':'🌐 മലയാളം';u()}
function go(v,c){H('mMod').classList.add('hidden');if(c)S.cat=c;S.view=v;u();scrollTo(0,0)}
function mOT(m){let t=0,p=`2026-${P(m+1)}-`;for(const[k,v]of Object.entries(S.att))if(k.startsWith(p)&&v.ot)t+=Number(v.ot)||0;return t}
function qOT(id){const c=QC.find(x=>x[0]===id)||QC[2],m=c.slice(2).map(i=>({i,n:MN[i],ot:mOT(i)})),u=m.reduce((a,b)=>a+b.ot,0);return{n:c[1],r:`${MN[c[2]]} – ${MN[c[4]]} 2026`,m,u,rem:Math.max(0,S.qCap-u)}}
function vFront(){
const ml=S.lang==='ml',opts=[['✓','permanent',ml?'സ്ഥിരം ജീവനക്കാരൻ':'Permanent Employee','Signed in as '+S.name,1],['02','contract',ml?'കരാർ ജീവനക്കാർ':'Company on Contract Employees','Contractual workforce & project staff',0],...(S.more?[['03','apprentice','Apprentice & Trainee','Skill development & yard trainees',0],['04','vendor','Vendor & Contractor','Sub-contractors & supplier partners',0]]:[])];
return`<div>${brand('')}<div class="fl m2"><span class="kB"></span><span class="kT">COCHIN SHIPYARD • KOCHI, INDIA</span></div><div class="m4"><h2 class="text-3xl m2">${ml?'മൈ സി.എസ്.എൽ പോർട്ടൽ':'Welcome to My CSL Portal'}</h2><p class="ts sm">Official digital workspace for Cochin Shipyard Limited employees, contractors, and maritime partners.</p></div><div class="gl m4"><div class="fb m3 text-[#5e8b9f] tx"><b>SELECT YOUR CATEGORY</b><span class="fm">01 — 01</span></div><h3 class="lg m4">How are you associated with CSL?</h3><div class="space-y-3 m3">${opts.map(([n,c,t,d,a])=>rc(`go('dashboard','${c}')`,a?'cA':'c1',n,a?'bg-[#0e3c54] border border-[#16b8d8] tc lg':'bg-[#0a2030] ts sm',t,d,a?'tc':'ts',a?'bC':'border border-slate-700 ts')).join('')}<div class="text-center"><button onclick="set('more',!S.more)" class="text-[#5e8b9f]">${S.more?'Fewer categories ∧':'More categories (Apprentice / Vendor) ∨'}</button></div></div><div class="pt-3 border-t border-[#0d2f44] fb"><div class="fl"><span class="w-2 h-2 rf bg-teal-400"></span><span>Selected: Permanent Employee</span></div><button onclick="go('dashboard','permanent')" class="tc fl"><b>Continue</b>${ARR}</button></div></div><div class="fc gap-2 ts"><span class="tc">🛡️</span><span>Authorized access only • Cochin Shipyard Limited</span></div></div>`;
}
function vDash(){
const q=qOT(S.qCyc),pct=Math.min(100,Math.round((q.u/S.qCap)*100)),sd=SH[S.sh]||SH.A2;
const cards=[['calendar','📅','Calendar','🏅 12 CSL Holidays · 2nd & 4th Sat Off',''],['salary','₹','Salary','Pay Slip, Maritime Allowance, PF & Deductions',''],['attendance','📋','Attendance',`Shift ${S.sh} · In: ${sd[1]} · Out: ${sd[2]}`,`Shift ${S.sh} · Present`],['money','🏦','Money Management','Bank Accounts, Credit Cards & Daily Expenses','NEW'],['tax','📊','Income Tax Calculator','FY 2026-27 New Tax Regime & Monthly TDS','']];
return`<div>${brand('front')}<div class="fb m3"><div class="fl"><span class="kB"></span><span class="kT">${S.cat==='contract'?'COMPANY ON CONTRACT':'PERMANENT EMPLOYEE'}</span></div><div class="ts fm">${S.tok} · <button onclick="go('front')" class="tc">Change</button></div></div><div class="cd fb m4"><div class="fl mw"><div class="rB bg-amber-500 text-slate-950 lg"><b>P</b></div><div class="mw"><div class="bs tr"><b>${S.name}</b></div><div class="tc fm tr">Code No: ${S.tok} · ${S.ph}</div></div></div><span class="bD rf tx"><b>ACTIVE</b></span></div><div class="m3"><h2 class="text-3xl">QuickAccess.</h2><p class="ts sm">Choose a service to continue.</p></div><div class="cd m3"><div class="fb m2"><div><h3 class="sm">⏱️ CSL Duty Shift</h3><span class="tx ts">${S.sh==='A2'||S.sh==='B2'?'A2 ⇄ B2 Weekly Rotation Active':'Fixed General Shift'}</span></div><span class="bD rf ta fm"><b>${S.sh}</b> <span class="tx ts">(${sd[1]}-${sd[2]})</span></span></div><div class="g4 m2">${Object.entries(SH).map(([k,v])=>`<button onclick="set('sh','${k}')" class="py-2 px-1 rx text-center ${S.sh===k?'bC':'sb ts'}"><b class="fm block">${k}</b><span class="text-[9px] block">${v[0]}</span><span class="text-[8px] fm">${v[1]}</span></button>`).join('')}</div><div class="fb tx ts pt-1 border-t border-[#0e2c3e]"><span>A2 ⇄ B2 Rotation in Calendar</span><span onclick="go('calendar')" class="tc">Open Calendar →</span></div></div><div class="cd m4"><div class="fb m3"><div class="fl"><div class="rB sb ta lg">⚡</div><div><div class="fl"><b class="sm">Quarterly Overtime (OT) Cap</b><span class="bD rf tx py-0.5 px-2">${q.n}</span></div><div class="tc">${q.r} (3 months)</div></div></div><div class="sb p-1 flex">${[75,120].map(n=>`<button onclick="set('qCap',${n})" class="px-2 py-1 rx ${S.qCap===n?'bC':'ts'}"><b>${n}h OT</b></button>`).join('')}</div></div><div class="sb m3"><div class="fb fm m2"><span>Used: <b class="ta">${q.u} hrs</b> / <span class="tc">${S.qCap} hrs</span></span><span>Remaining: <b class="te">${q.rem} hrs</b></span></div><div class="w-full h-2.5 bg-[#071f30] rf overflow-hidden m3"><div class="h-full bg-gradient-to-r from-cyan-400 to-amber-400" style="width:${pct}%"></div></div><div class="g3 text-center">${q.m.map(m=>`<div onclick="S.cM=${m.i};go('attendance')" class="sb"><div class="ts fm">${m.n}</div><b class="ta fm">${m.ot}h OT</b></div>`).join('')}</div></div><div class="g4 m2">${QC.map(c=>`<button onclick="set('qCyc',${c[0]})" class="py-1.5 rx ${S.qCyc===c[0]?'bD':'sb ts'}"><b>${c[1]} (${qOT(c[0]).u}h)</b></button>`).join('')}</div><button onclick="go('attendance')" class="w-full bD fb"><b>View 3-Month Breakdown & All Cycles</b><span>›</span></button></div><div class="space-y-3 m4">${cards.map(([v,ic,t,s,bd])=>rc(`go('${v}')`,'cd',ic,'sb tc lg',t+(bd?` <span class="bD rf tx py-0.5 px-2">${bd}</span>`:''),s,'ts','sb ts')).join('')}</div></div>`;
}
function vAtt(){
const m=S.cM,q=qOT(S.qCyc),p=`2026-${P(m+1)}-`,l=Object.entries(S.att).filter(([k])=>k.startsWith(p)).sort((a,b)=>b[0].localeCompare(a[0]));
const f=[['Date','aDt','date',p+'02'],['Punch In','aIn','text','07:00 AM'],['Punch Out','aOut','text','05:30 PM'],['OT Hours','aOt','number','2']].map(([lb,id,t,v])=>`<div><label class="t0">${lb}</label>${ip(id,'',t,v)}</div>`).join('')+`<div><label class="t0">Status</label>${sl('aSt','P,WO,CL')}</div><div><label class="t0">Note</label>${ip('aNt','Shift/Vessel')}</div>`;
return pg('📋 Attendance & Overtime','Syncs with Calendar, Salary & Quarterly OT Cap',`<select onchange="set('cM',Number(this.value))" class="bD">${MN.map((n,i)=>`<option value="${i}" ${i===m?'selected':''}>${n} 2026</option>`).join('')}</select>`,`<div class="g3 m3">${st('Month OT',mOT(m)+' hrs','ta')}${st(q.n+' Used',q.u+'/'+S.qCap+'h')}${st('Remaining',q.rem+' hrs','te')}</div>${sc('➕ Punch Duty & Overtime (OT)','tc','',f,'svA()','Save Attendance & Sync OT','bC')}<div class="g2 m3"><button onclick="shW()" class="bt bg-emerald-600 text-white">📲 Share WhatsApp</button><button onclick="dlO()" class="bt bD w-full">⬇️ Download Report</button></div><div class="space-y-2">${l.map(([d,v])=>rw(`${fD(d)} (${v.s})`,`${v.in}–${v.out} · ${v.nt||''}`,`${v.ot||0}h OT`,'ta',`delete S.att['${d}']`)).join('')}</div>`);
}
function svA(){const d=H('aDt').value;if(d){S.att[d]={s:H('aSt').value,in:H('aIn').value,out:H('aOut').value,ot:Number(H('aOt').value)||0,nt:H('aNt').value};set('cM',Number(d.split('-')[1])-1)}}
function oTx(){const m=S.cM,q=qOT(S.qCyc),p=`2026-${P(m+1)}-`;let t=`*MY CSL OVERTIME REPORT*\n${S.name} (${S.tok}) | ${MN[m]} 2026: *${mOT(m)}h OT* | ${q.n}: *${q.u}/${S.qCap}h*\n`;Object.entries(S.att).filter(([k])=>k.startsWith(p)).forEach(([d,v])=>{t+=`${fD(d)}: ${v.s} (${v.in}-${v.out}) *OT:${v.ot||0}h*\n`});return t}
function shW(){const t=oTx();if(navigator.share)navigator.share({text:t}).catch(()=>{});else location.href='https://api.whatsapp.com/send?text='+encodeURIComponent(t)}
function dlO(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([oTx()]));a.download=`CSL_OT_${MN[S.cM]}.txt`;a.click()}
function vCal(){
const m=S.cM,dim=new Date(2026,m+1,0).getDate(),fd=new Date(2026,m,1).getDay();let c='<div></div>'.repeat(fd);
for(let d=1;d<=dim;d++){const dt=`2026-${P(m+1)}-${P(d)}`,ot=Number(S.att[dt]?.ot)||0,w=new Date(2026,m,d).getDay(),sh=w===0?'OFF':(Math.floor((d-1)/7)%2===0?S.sh:(S.sh==='A2'?'B2':'A2'));c+=`<div onclick="qO('${dt}')" class="p-1.5 rx ${ot?'bg-amber-500/20 border border-amber-400':'sb'} text-center"><b>${d}</b><div class="text-[9px] ${w===0?'text-rose-400':'tc'}"><b>${sh}</b></div><div class="text-[9px] ta"><b>${ot?ot+'h OT':'-'}</b></div></div>`}
return pg('📅 2026 CSL Shift & OT Calendar','Tap any date to add/update Overtime hours',`<button onclick="set('sh',S.sh==='A2'?'B2':'A2')" class="bt bC">Shift ${S.sh}</button>`,`<div class="fb m3"><button onclick="set('cM',(S.cM+11)%12)" class="bD">◀ Prev</button><div class="text-center"><b class="sm">${MN[m]} 2026</b><div class="ta"><b>Month OT: ${mOT(m)} hrs</b></div></div><button onclick="set('cM',(S.cM+1)%12)" class="bD">Next ▶</button></div><div class="g7 text-center tx tc mb-1">${'SUN,MON,TUE,WED,THU,FRI,SAT'.split(',').map(d=>`<b>${d}</b>`).join('')}</div><div class="g7">${c}</div>`);
}
function qO(d){const v=prompt('Overtime (OT) hours for '+fD(d)+':',S.att[d]?.ot||0);if(v!==null){S.att[d]={...(S.att[d]||{s:'P',in:SH[S.sh][1],out:SH[S.sh][2],nt:'Shift '+S.sh}),ot:Number(v)||0};u()}}
function vSal(){
const s=S.sal,mH=mOT(S.cM),fix=Math.round(s.b*(1+(s.da+s.hr+s.pr)/100)),otP=Math.round(mH*s.otR),gr=fix+otP;
return pg('💵 CSL Salary & OT Calculator',`Synced with ${MN[S.cM]} Overtime (${mH} hrs)`,'',`<div class="g3 m3">${st('Gross Pay',R(gr))}${st('OT Pay ('+mH+'h)',R(otP),'ta')}${st('Net Pay',R(gr-s.pf),'te')}</div><div class="g2">${[['b','Basic Pay (₹)'],['da','DA (%)'],['hr','HRA (%)'],['pr','Perks (%)'],['otR','OT Rate/Hr (₹)'],['pf','PF & Deductions (₹)']].map(([k,l])=>`<div><label class="t0">${l}</label><input type="number" value="${s[k]}" onchange="S.sal.${k}=Number(this.value);u()" class="inp"/></div>`).join('')}</div>`);
}
function vTax(){
const inc=Number(S.tax.inc)||0,txb=Math.max(0,inc-75000),tot=txb<=1200000?0:Math.round((txb-1200000)*.156);
return pg('📊 Income Tax Calculator','FY 2026-27 New Regime • Zero Tax up to ₹12.75L','',`<label class="t0">Annual Gross Income (₹)</label><input type="number" value="${inc}" onchange="S.tax.inc=Number(this.value);u()" class="inp m3"/><div class="g3">${st('Taxable',R(txb))}${st('Annual Tax',R(tot),'te')}${st('Monthly TDS',R(Math.round(tot/12)),'ta')}</div>`);
}
function vMon(){
const tB=S.bks.reduce((a,b)=>a+(Number(b.bl)||0),0),tC=S.cds.reduce((a,c)=>a+(Number(c.us)||0),0),tS=S.txs.reduce((a,x)=>a+(Number(x.a)||0),0);
return pg('🏦 Money Management Hub','Bank Accounts, Credit Cards & Daily Spend (DD/MM/YYYY + Time)','',`<div class="g3 m3">${st('Bank Balance',R(tB),'te')}${st('Card Used',R(tC),'ta')}${st('Total Spend',R(tS),'text-rose-400')}</div>${sc(`🏦 Bank Accounts (${S.bks.length})`,'te',S.bks.map(b=>rw(b.b,`${b.tp} ••••${b.ac}`,R(b.bl),'te',`S.bks=S.bks.filter(x=>x.id!==${b.id})`)).join(''),`${ip('bN','Bank Name (SBI/Federal)')}${ip('bA','A/C Last 4 Digits')}${sl('bT','Savings,Salary')}${ip('bB','Balance (₹)','number')}`,'adB()','Add Bank Account','bg-emerald-600 text-white')}${sc(`💳 Credit Cards (${S.cds.length})`,'ta',S.cds.map(c=>rw(c.b,'Due: '+c.du,R(c.us),'ta',`S.cds=S.cds.filter(x=>x.id!==${c.id})`)).join(''),`${ip('cN','Card Name')}${ip('cU','Used Amount (₹)','number')}`,'adC()','Add Credit Card','bg-amber-500 text-slate-950')}${sc('🧾 Record Spend (Day/Month/Year + Time)','tc',S.txs.map(x=>rw(x.t,`${x.m} • 🕒 ${x.dt}`,'-'+R(x.a),'text-rose-400',`S.txs=S.txs.filter(i=>i.id!==${x.id})`)).join(''),`${ip('xT','Expense Title')}${ip('xA','Amount (₹)','number')}${sl('xM','Bank Account,Credit Card,UPI / Cash')}${ip('xD','','text',nDT())}`,'adX()','Add Spend Entry','bC')}`);
}
function adB(){const b=H('bN').value.trim();if(b){S.bks.unshift({id:Date.now(),b,ac:H('bA').value||'0000',tp:H('bT').value,bl:Number(H('bB').value)||0});u()}}
function adC(){const b=H('cN').value.trim();if(b){S.cds.unshift({id:Date.now(),b,us:Number(H('cU').value)||0,du:'15/12/2026'});u()}}
function adX(){const t=H('xT').value.trim(),a=Number(H('xA').value)||0;if(t&&a){S.txs.unshift({id:Date.now(),t,m:H('xM').value,a,dt:H('xD').value||nDT()});u()}}
function render(){
H('hdrLogo').innerHTML=LOGO.replace(/40/g,'32');
H('mMod').innerHTML=[['front','🏠 Front Page'],['dashboard','⚡ Dashboard'],['calendar','📅 Calendar'],['salary','💵 Salary'],['attendance','📋 Attendance'],['money','🏦 Money Hub'],['tax','📊 Income Tax']].map(([v,l])=>`<button onclick="go('${v}')" class="p-2 rx sb text-left fb"><b>${l}</b><span>→</span></button>`).join('');
H('appView').innerHTML=({front:vFront,dashboard:vDash,attendance:vAtt,calendar:vCal,salary:vSal,tax:vTax,money:vMon}[S.view]||vFront)();
}
render();
</script>
</body>
</html>
